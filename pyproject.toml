[project]
name = "autodeploy"
version = "1.0.0"
description = "AutoDeploy — 병원 납품 서버 자동 설치 및 Slack 진행상황 공유 봇"
requires-python = ">=3.11"
dependencies = [
    "slack-bolt>=1.18.0",
    "asyncssh>=2.14.0",
    "aiosqlite>=0.19.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "aiohttp>=3.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-mock>=3.12.0",
]

[project.scripts]
autodeploy = "autodeploy.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# static 을 빼면 비편집(non-editable) 설치에서 create_app 의
# Path(__file__).with_name("static") 이 빈 경로를 가리켜 /static/ 라우트가
# 아예 등록되지 않는다. 로그인 화면은 200 인데 CSS·JS 가 404 라 백지로 뜬다.
# node_prep.sh 는 타겟으로 전송해 실행하는 스크립트다. 빠지면 hybrid 서버의
# 키 등록에서 파일을 못 찾는다.
autodeploy = ["schema.sql", "node_prep.sh", "web/static/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
